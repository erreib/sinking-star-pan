; Sinking Star Pan — drag the local area (Q) view with the mouse.
[pan]
; mouse button that drags the map: left | right | middle
button = left
; set to 1 to flip a direction
invert_x = 0
invert_y = 0
; drag speed multiplier (1.0 = the map follows the cursor exactly)
sensitivity = 1.0
; farthest the view can be dragged from where the game put it, in world units
max_offset = 500
; which overhead views can be dragged: 2 = the local area view (Q). Add 1 to also allow the full map view.
modes = 2

[log]
enabled = 1
; 1 = log camera state every couple of seconds (for troubleshooting)
debug = 0
