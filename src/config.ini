; Sinking Star Pan — look around in the local area (Q) view with the mouse.
[pan]
; move = the view follows the mouse position while the Q view is open (no clicking)
; drag = hold a mouse button and drag the map
mode = move
; move mode: how far the view goes when the cursor reaches the window edge, in half-screens (1.0 = half a screen, 2.0 = a full screen)
gain = 1.3
; move mode: easing time in seconds (0 = instant)
smoothing = 0.08
; move mode: 1 = warp the cursor to the window centre when the view opens, so you start on the player
;            with the full range in every direction; 0 = measure from wherever the cursor was
recenter_cursor = 1
; drag mode: mouse button that drags: left | right | middle
button = left
; drag mode: drag speed multiplier (1.0 = the map follows the cursor exactly)
sensitivity = 1.0
; set to 1 to flip a direction (either mode)
invert_x = 0
invert_y = 0
; farthest the view can be moved from where the game put it, in world units
max_offset = 500
; which overhead views can be panned: 2 = the local area view (Q). Add 1 to also allow the full map view.
modes = 2

[log]
enabled = 1
; 1 = log camera state every couple of seconds (for troubleshooting)
debug = 0
